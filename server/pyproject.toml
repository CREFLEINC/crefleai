[project]
name = "crefleai"
version = "0.4.0"
description = "CREFLE 사내 로컬 LLM 서비스 서버"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "nvidia-ml-py>=12.560",
]

[project.optional-dependencies]
# 0.3.34+: 카탈로그의 신형 아키텍처(gemma4, qwen35, deepseek2 등) 지원 llama.cpp 내장
worker = ["llama-cpp-python>=0.3.34"]

[project.scripts]
crefleai = "crefleai.main:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crefleai"]

[tool.pytest.ini_options]
markers = ["inference: 실제 GGUF 모델 로드가 필요한 테스트 (기본 제외)"]
addopts = "-m 'not inference'"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends() pattern in default arguments is idiomatic
